# ARCHITECTURE.md §8.4 — restore → web tests → Release build → Core tests → unsigned MSIX artifact.
# UI (FlaUI) tests are skipped automatically (MARKPAD_UI_TESTS is not set on the runner).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MarkPad.Editor.Web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Web — install, lint, test (round-trip corpus)
        working-directory: src/MarkPad.Editor.Web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test

      - name: Restore
        run: dotnet restore MarkPad.sln

      - name: Build (Release, builds the editor bundle first)
        run: dotnet build src/MarkPad.App/MarkPad.App.csproj -c Release --no-restore

      - name: Core tests
        run: dotnet test tests/MarkPad.Core.Tests/MarkPad.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx"

      - name: UI tests (skipped: no interactive desktop)
        run: dotnet test tests/MarkPad.App.UiTests/MarkPad.App.UiTests.csproj -c Release --no-restore

      - name: MSIX (unsigned)
        shell: pwsh
        run: build/pack.ps1 -NoSign

      - uses: actions/upload-artifact@v4
        with:
          name: markpad-msix-unsigned
          path: |
            out/**/*.msix
            docs/perf/roundtrip-report.md
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: markpad-msix-unsigned
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.msix
          body: 'Unsigned sideload package. Sign with build/pack.ps1 before installing (see README).'
